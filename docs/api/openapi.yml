openapi: 3.0.3
info:
  title: API Vendehumos
  description: API para registrar y consultar vendehumos, con registro y login de usuarios mediante JWT.
  version: 1.0.0
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC
servers:
  - url: http://localhost:3000
    description: Servidor local
tags:
  - name: Salud
    description: Estado de la API
  - name: Auth
    description: Registro y login de usuarios
  - name: Vendehumos
    description: Gestión de vendehumos
paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprueba que la API está levantada
      operationId: health
      security: []
      responses:
        '200':
          description: La API funciona correctamente
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: object
                    required: [ok]
                    properties:
                      ok:
                        type: boolean
                        example: true
  /auth/registro:
    post:
      tags: [Auth]
      summary: Registra un usuario y devuelve su token
      operationId: registro
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password]
              properties:
                nombre:
                  type: string
                  example: Ana
                email:
                  type: string
                  format: email
                  description: Se recorta y se guarda en minúsculas.
                  example: ana@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Debe contener al menos una letra y un número.
                  example: secreta123
                rol:
                  type: string
                  enum: [usuario-free, usuario]
                  default: usuario-free
                  description: '`admin` no se admite en el registro público.'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAuth'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El email ya está registrado
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión y devuelve un token JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: ana@example.com
                password:
                  type: string
                  example: secreta123
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAuth'
        '400':
          description: Faltan email o password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '401':
          description: Credenciales inválidas (mismo mensaje para email o contraseña incorrectos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Credenciales inválidas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT devuelto por /auth/registro y /auth/login (caduca a las 24 h). Declarado para uso futuro; ningún endpoint lo exige todavía.
  schemas:
    Usuario:
      type: object
      required: [id, nombre, email, rol, createdAt]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana
        email:
          type: string
          format: email
          example: ana@example.com
        rol:
          type: string
          enum: [admin, usuario-free, usuario]
          example: usuario-free
        createdAt:
          type: string
          example: '2026-11-11 10:00:00'
    Vendehumo:
      type: object
      required: [id, nombre, urlFoto, categoria, descripcion, numeroVotos]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Curso milagro
        urlFoto:
          type: string
          format: uri
          example: https://example.com/foto.jpg
        categoria:
          type: string
          enum: [TECNOLOGIA, FINANZAS, SALUD, MARKETING, COACHING, OTROS]
          example: COACHING
        descripcion:
          type: string
          example: Hazte rico en 3 días
        numeroVotos:
          type: integer
          example: 0
    PaginaVendehumos:
      type: object
      required: [self, first, last, items]
      properties:
        self:
          type: string
          example: /vendehumos?page=2&size=10
        first:
          type: string
          example: /vendehumos?page=1&size=10
        prev:
          type: string
          description: Solo si no es la primera página.
          example: /vendehumos?page=1&size=10
        next:
          type: string
          description: Solo si no es la última página.
          example: /vendehumos?page=3&size=10
        last:
          type: string
          example: /vendehumos?page=3&size=10
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vendehumo'
    RespuestaAuth:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          description: JWT con payload { sub, email, rol }.
        usuario:
          $ref: '#/components/schemas/Usuario'
    Errores:
      type: object
      required: [errores]
      properties:
        errores:
          type: array
          items:
            type: string
          example: [nombre es obligatorio]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Credenciales inválidas
